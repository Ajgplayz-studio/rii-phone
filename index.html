<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Wii Phone</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html, body { height:100%; }
  body {
    font-family:"Segoe UI", system-ui, -apple-system, sans-serif;
    background:#0b1030;
    display:flex; align-items:center; justify-content:center;
    min-height:100vh; min-height:100dvh;
  }
  /* ---------- phone frame ---------- */
  .phone {
    position:relative; width:min(400px, 100vw); height:min(800px, 100vh); height:min(800px, 100dvh);
    background:linear-gradient(170deg,#eef7ff 0%,#d6ecfb 55%,#c2e2f8 100%);
    overflow:hidden; display:flex; flex-direction:column; color:#1c2b39;
  }
  @media (min-width:480px) and (min-height:860px){
    .phone { border-radius:44px; border:10px solid #10131c; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  }
  /* ---------- top bar ---------- */
  .topbar {
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 6px;
  }
  .wordmark { font-size:24px; font-weight:800; letter-spacing:1px; color:#2b6cb0; }
  .wordmark span { color:#8a8f9e; font-weight:600; }
  .clock { text-align:right; line-height:1.2; }
  .clock .time { font-size:20px; font-weight:800; }
  .clock .date { font-size:12px; color:#5b6b7a; font-weight:600; }
  /* ---------- channel grid ---------- */
  .grid {
    flex:1; display:grid; grid-template-columns:repeat(4, 1fr); grid-template-rows:repeat(3, 1fr);
    gap:10px; padding:12px 14px;
  }
  .channel {
    border:2px solid rgba(255,255,255,.9); border-radius:14px; cursor:pointer;
    background:linear-gradient(180deg,#ffffff,#eaf4fc);
    box-shadow:0 3px 8px rgba(43,108,176,.18);
    display:flex; flex-direction:column; align-items:center; justify-content:center; gap:6px;
    font-family:inherit; color:#1c2b39; padding:6px 4px;
    transition:transform .08s ease, box-shadow .08s ease;
    user-select:none; -webkit-user-select:none; -webkit-touch-callout:none;
  }
  .channel:hover { box-shadow:0 6px 14px rgba(43,108,176,.28); }
  .channel:active { transform:scale(.94); }
  .channel .icon { font-size:34px; line-height:1; }
  .channel .lbl { font-size:11px; font-weight:700; text-align:center; line-height:1.2;
    max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .channel .plus { font-size:26px; color:rgba(91,107,122,.45); font-weight:300; }
  .channel.empty { background:rgba(255,255,255,.35); border-style:dashed;
    border-color:rgba(91,107,122,.35); box-shadow:none; cursor:default; }
  /* ---------- bottom bar ---------- */
  .bottombar {
    flex:none; display:flex; align-items:center; justify-content:space-between;
    padding:10px 18px 18px;
  }
  .wii-btn {
    width:56px; height:56px; border-radius:50%; border:3px solid #fff; cursor:pointer;
    background:linear-gradient(180deg,#fdfdfd,#dbe9f4); color:#2b6cb0;
    font-size:17px; font-weight:800; font-family:inherit;
    box-shadow:0 4px 10px rgba(43,108,176,.3);
    transition:transform .08s ease;
  }
  .wii-btn:active { transform:scale(.92); }
  .dots { display:flex; gap:7px; }
  .dots i { width:8px; height:8px; border-radius:50%; background:#9db8cc; }
  .dots i.on { background:#2b6cb0; }
  .hint { font-size:12px; color:#5b6b7a; font-weight:600; }
  /* ---------- channel overlay ---------- */
  .overlay {
    position:absolute; inset:0; z-index:10; display:none;
    flex-direction:column; align-items:center; justify-content:center; gap:14px;
    background:linear-gradient(170deg,#eef7ff,#c2e2f8); padding:24px; text-align:center;
  }
  .overlay.open { display:flex; }
  .overlay .ov-card { display:flex; flex-direction:column; align-items:center; gap:12px;
    background:rgba(255,255,255,.78); border:2px solid #fff; border-radius:20px;
    padding:26px 22px; width:min(320px, 92%); box-shadow:0 14px 34px rgba(43,108,176,.25); text-align:center; }
  .overlay .ov-icon { font-size:52px; line-height:1; }
  .overlay h2 { font-size:22px; font-weight:800; }
  .overlay p { font-size:14px; color:#5b6b7a; line-height:1.5; }
  .overlay p b { color:#1c2b39; }
  .overlay .ov-site { font-size:12px; color:#5b6b7a; word-break:break-all; }
  .overlay input { width:100%; padding:12px 14px; border-radius:12px; border:2px solid #bcd6ea;
    font-size:15px; font-family:inherit; outline:none; background:#fff; color:#1c2b39; }
  .overlay input:focus { border-color:#2b6cb0; }
  .overlay .ov-error { font-size:13px; color:#c0392b; font-weight:700; min-height:18px; }
  .overlay .ov-row { display:flex; gap:10px; margin-top:4px; }
  .overlay .ov-btn { padding:12px 26px; border:none; border-radius:999px; cursor:pointer;
    background:#2b6cb0; color:#fff; font-size:15px; font-weight:800; font-family:inherit;
    box-shadow:0 6px 14px rgba(43,108,176,.35); }
  .overlay .ov-btn:active { transform:scale(.96); }
  .overlay .ov-btn.ghost { background:rgba(255,255,255,.85); color:#2b6cb0; box-shadow:none;
    border:2px solid #bcd6ea; }
  /* ---------- mode switch ---------- */
  .mode-switch { display:flex; background:rgba(255,255,255,.7); border:2px solid #fff;
    border-radius:999px; overflow:hidden; box-shadow:0 3px 8px rgba(43,108,176,.18); }
  .mode-switch button { border:none; background:transparent; cursor:pointer;
    padding:8px 13px; font-size:13px; font-weight:800; font-family:inherit; color:#5b6b7a; }
  .mode-switch button.on { background:#2b6cb0; color:#fff; }
  /* ---------- pc mode ---------- */
  .phone.pc { width:min(1100px, 100vw); height:min(700px, 100vh); height:min(700px, 100dvh);
    border:none; border-radius:0; }
  .phone.pc .grid { grid-template-columns:repeat(6, 1fr); grid-template-rows:repeat(2, 1fr); }
  .phone.pc .channel .icon { font-size:52px; }
  .phone.pc .channel .lbl { font-size:13px; }
</style>
</head>
<body>

<div class="phone" id="phone">
  <div class="topbar">
    <div class="wordmark">Wii<span>Phone</span></div>
    <div class="clock">
      <div class="time" id="clockTime">--:--</div>
      <div class="date" id="clockDate"></div>
    </div>
  </div>

  <div class="grid" id="grid"></div>

  <div class="bottombar">
    <button class="wii-btn" id="wiiBtn" title="Wii Menu">Wii</button>
    <div class="dots"><i class="on"></i><i></i><i></i></div>
    <div class="mode-switch" id="modeSwitch">
      <button class="on" data-mode="phone">📱 Phone</button>
      <button data-mode="pc">🖥️ PC</button>
    </div>
  </div>

  <div class="overlay" id="overlay"></div>
</div>

<script>
  var grid = document.getElementById("grid");
  var overlay = document.getElementById("overlay");
  var SLOTS = 12;
  var channels = loadChannels();

  function loadChannels(){
    try {
      var saved = JSON.parse(localStorage.getItem("wii-phone-channels") || "null");
      if (Array.isArray(saved)) {
        var list = saved.slice(0, SLOTS);
        while (list.length < SLOTS) list.push(null);
        return list;
      }
    } catch(e){}
    var empty = [];
    for (var i = 0; i < SLOTS; i++) empty.push(null);
    return empty;
  }
  function saveChannels(){
    try { localStorage.setItem("wii-phone-channels", JSON.stringify(channels)); } catch(e){}
  }
  function normalizeSite(raw){
    var s = (raw || "").trim();
    if (!s) return null;
    if (!/^[a-z][a-z0-9+.-]*:\/\//i.test(s)) s = "https://" + s;
    try {
      var u = new URL(s);
      if (!u.hostname || u.hostname.indexOf(".") === -1) return null;
      return u.href;
    } catch(e){ return null; }
  }
  function nameFromUrl(url){
    try { return new URL(url).hostname.replace(/^www\./, ""); }
    catch(e){ return url; }
  }
  function escapeHtml(s){
    return String(s).replace(/[&<>"]/g, function(c){ return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]; });
  }

  function renderGrid(){
    grid.innerHTML = "";
    channels.forEach(function(ch, i){
      var b = document.createElement("button");
      if (ch) {
        b.className = "channel";
        b.innerHTML = '<span class="icon">\u{1F310}</span><span class="lbl">' + escapeHtml(ch.name) + '</span>';
      } else {
        b.className = "channel empty";
        b.innerHTML = '<span class="plus">+</span>';
      }
      attachSlot(b, i);
      grid.appendChild(b);
    });
  }

  function attachSlot(el, i){
    var timer = null, longPressed = false, sx = 0, sy = 0;
    el.addEventListener("pointerdown", function(e){
      longPressed = false; sx = e.clientX; sy = e.clientY;
      timer = setTimeout(function(){ longPressed = true; onHold(i); }, 600);
    });
    function cancel(){
      if (timer) { clearTimeout(timer); timer = null; }
    }
    el.addEventListener("pointerup", cancel);
    el.addEventListener("pointercancel", cancel);
    el.addEventListener("pointerleave", cancel);
    el.addEventListener("pointermove", function(e){
      if (timer && (Math.abs(e.clientX - sx) > 10 || Math.abs(e.clientY - sy) > 10)) cancel();
    });
    el.addEventListener("click", function(){
      if (longPressed) { longPressed = false; return; }
      var ch = channels[i];
      if (ch) window.open(ch.url, "_blank", "noopener");
    });
    el.addEventListener("contextmenu", function(e){ e.preventDefault(); });
  }

  function hideOverlay(){ overlay.classList.remove("open"); overlay.innerHTML = ""; }
  function showOverlay(html){ overlay.innerHTML = html; overlay.classList.add("open"); }

  function onHold(i){
    var ch = channels[i];
    if (ch) {
      showOverlay(
        '<div class="ov-card"><div class="ov-icon">\u{1F310}</div><h2>Replace this channel?</h2>' +
        '<p><b>' + escapeHtml(ch.name) + '</b></p><p class="ov-site">' + escapeHtml(ch.url) + '</p>' +
        '<div class="ov-row"><button class="ov-btn" id="ovYes">Yes, replace</button>' +
        '<button class="ov-btn ghost" id="ovNo">No</button></div></div>');
    } else {
      showOverlay(
        '<div class="ov-card"><div class="ov-icon">+</div><h2>Create a channel here?</h2>' +
        '<p>Pick a site and it becomes a channel in this slot.</p>' +
        '<div class="ov-row"><button class="ov-btn" id="ovYes">Yes</button>' +
        '<button class="ov-btn ghost" id="ovNo">No</button></div></div>');
    }
    document.getElementById("ovNo").addEventListener("click", hideOverlay);
    document.getElementById("ovYes").addEventListener("click", function(){ showForm(i); });
  }

  function showForm(i){
    var ch = channels[i];
    showOverlay(
      '<form class="ov-card" id="ovForm"><div class="ov-icon">\u{1F310}</div><h2>' +
      (ch ? "Replace channel" : "Create channel") + '</h2>' +
      '<p>Type a site, like youtube.com</p>' +
      '<input id="ovSite" type="text" inputmode="url" autocomplete="off" spellcheck="false" placeholder="example.com" value="' + (ch ? escapeHtml(ch.url) : "") + '">' +
      '<div class="ov-error" id="ovError"></div>' +
      '<div class="ov-row"><button class="ov-btn" type="submit">Make it</button>' +
      '<button class="ov-btn ghost" type="button" id="ovCancel">Cancel</button></div></form>');
    var input = document.getElementById("ovSite");
    input.focus();
    document.getElementById("ovCancel").addEventListener("click", hideOverlay);
    document.getElementById("ovForm").addEventListener("submit", function(e){
      e.preventDefault();
      var url = normalizeSite(input.value);
      if (!url) {
        document.getElementById("ovError").textContent = "That doesn't look like a site. Try something like youtube.com";
        return;
      }
      channels[i] = { url: url, name: nameFromUrl(url) };
      saveChannels(); renderGrid(); hideOverlay();
    });
  }

  renderGrid();

  document.getElementById("wiiBtn").addEventListener("click", hideOverlay);
  document.addEventListener("keydown", function(e){ if (e.key === "Escape") { hideOverlay(); } });

  /* ---------- pc / phone mode switch ---------- */
  var phoneEl = document.getElementById("phone");
  var modeBtns = document.querySelectorAll("#modeSwitch button");
  function setMode(mode){
    phoneEl.classList.toggle("pc", mode === "pc");
    modeBtns.forEach(function(b){ b.classList.toggle("on", b.dataset.mode === mode); });
    try { localStorage.setItem("wii-phone-mode", mode); } catch(e){}
  }
  modeBtns.forEach(function(b){
    b.addEventListener("click", function(){ setMode(b.dataset.mode); });
  });
  try { setMode(localStorage.getItem("wii-phone-mode") === "pc" ? "pc" : "phone"); } catch(e){}

  function tick(){
    var d = new Date();
    var h = d.getHours(), m = String(d.getMinutes()).padStart(2, "0");
    var ap = h >= 12 ? "PM" : "AM"; h = h % 12 || 12;
    document.getElementById("clockTime").textContent = h + ":" + m + " " + ap;
    var days = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
    var mos = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
    document.getElementById("clockDate").textContent = days[d.getDay()] + " " + mos[d.getMonth()] + " " + d.getDate();
  }
  setInterval(tick, 1000); tick();
</script>

</body>
</html>
